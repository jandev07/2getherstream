[package]
name = "together2-windows"
version.workspace = true
edition.workspace = true
[features]
custom-protocol = ["tauri/custom-protocol"]
private-alpha-account-links = ["together-source-resolver/private-alpha-account-links"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
qrcodegen = "=1.8.0"
zeroize = "1"
tauri = { version = "2", features = [] }
together-session-server = { path = "../../../crates/session-server" }
together-sync-core = { path = "../../../crates/sync-core" }
together-player-mpv = { path = "../../../crates/player-mpv" }
together-source-resolver = { path = "../../../crates/source-resolver" }
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
serde.workspace = true
serde_json.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
[[example]]
name = "torbox-native-proof"
required-features = ["private-alpha-account-links"]
[[example]]
name = "torbox-paired-proof"
required-features = ["private-alpha-account-links"]

[dev-dependencies]
# Reuse the workspace server transport-test client; not linked into application builds.
tokio-tungstenite = "0.29"
futures-util = "0.3"
