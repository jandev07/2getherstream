[workspace]
members = ["crates/sync-core", "crates/session-server", "crates/player-mpv", "crates/source-resolver", "apps/windows/src-tauri"]
default-members = ["crates/sync-core", "crates/session-server", "crates/player-mpv", "crates/source-resolver"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
