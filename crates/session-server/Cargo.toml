[package]
name = "together-session-server"
version.workspace = true
edition.workspace = true
[dependencies]
together-sync-core = { path = "../sync-core" }
together-source-resolver = { path = "../source-resolver" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
uuid = { version = "1", features = ["v4","serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
sha2 = "0.10"
subtle = "2"
zeroize = "1"
url = "2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_Security_Cryptography","Win32_System_Threading","Win32_System_JobObjects"] }
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
